name: Chemify Limited
description: 'Chemify Limited is a chemistry-automation company founded in 2022 by Professor Lee Cronin,
  building on two decades of research at the University of Glasgow and headquartered in Glasgow, Scotland.
  Chemify develops "Chemputation" — programmable chemistry — fusing chemistry, robotics, computation,
  machine learning, and its own universal chemical programming language (chi-DL / XDL) to digitize the
  discovery, design, and synthesis of molecules on hardware-agnostic robotic chemistry platforms. Its
  ASSEMBLER stack converts optimized reaction information into fully defined chemical code that automated
  synthesis machines can execute. The company is backed by Insight Partners and DCVC. Chemify does not
  currently publish a public developer API, SDK, or developer portal; this profile is maintained in the
  API Evangelist network as a company record with domain-security posture and public site properties.'
